
services:
  # ==========================================
  # MySQL Database
  # ==========================================
  db:
    image: mysql:8.4
    container_name: fertilizer-mysql

    env_file:
      - ./mysql.env

    ports:
      - "3307:3306"

    volumes:
      - fertilizer_mysql_data:/var/lib/mysql

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - NET_RAW

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==========================================
  # Node.js Express Backend
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: fertilizer-backend

    ports:
      - "5001:5001"

    env_file:
      - ./backend/.env

    environment:
      DB_HOST: db
      DB_PORT: 3306

    volumes:
      - ./backend/uploads:/app/uploads

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ==========================================
  # React Frontend with Nginx
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5001

    container_name: fertilizer-frontend

    ports:
      - "3001:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    # Retain privilege protection
    security_opt:
      - no-new-privileges:true

    # Keep default Nginx filesystem permissions
    # and capabilities until using an unprivileged image.

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ==========================================
# Persistent Database Storage
# ==========================================
volumes:
  fertilizer_mysql_data:
    name: fertilizer_mysql_data
