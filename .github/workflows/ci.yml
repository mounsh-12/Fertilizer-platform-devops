
name: Fertilizer Platform CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint --if-present

      - name: Build frontend
        run: npm run build

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test --if-present

      - name: Run backend lint
        run: npm run lint --if-present

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest

    needs:
      - frontend-ci
      - backend-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Dockerfiles
        run: |
          ls -l backend/Dockerfile
          ls -l frontend/Dockerfile
          test -s backend/Dockerfile
          test -s frontend/Dockerfile

      - name: Build backend Docker image
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag fertilizer-backend:ci \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            --file frontend/Dockerfile \
            --build-arg VITE_API_URL=http://localhost:5001 \
            --tag fertilizer-frontend:ci \
            ./frontend
