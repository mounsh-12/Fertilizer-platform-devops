
name: Fertilizer Platform CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci
     
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Run frontend lint
        run: npm run lint --if-present

      - name: Build frontend
        run: npm run build

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm ci

      - name: Audit backend dependencies
        run: npm audit --audit-level=high

      - name: Run backend tests
        run: npm test --if-present

      - name: Run backend lint
        run: npm run lint --if-present

  docker-build-and-scan:
    name: Docker Build and Trivy Security Gates
    runs-on: ubuntu-latest

    needs:
      - frontend-ci
      - backend-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Dockerfiles and Nginx configuration
        run: |
          test -s backend/Dockerfile
          test -s frontend/Dockerfile
          test -s frontend/nginx.conf
          echo "Required Docker files verified."

      - name: Build backend Docker image
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag fertilizer-backend:ci \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            --file frontend/Dockerfile \
            --build-arg VITE_API_URL=http://localhost:5001 \
            --tag fertilizer-frontend:ci \
            ./frontend

      # Generate complete reports without failing the pipeline.
      - name: Generate backend Trivy report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fertilizer-backend:ci
          format: table
          output: backend-trivy-report.txt
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'

      - name: Generate frontend Trivy report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fertilizer-frontend:ci
          format: table
          output: frontend-trivy-report.txt
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'

      # Enforce security gates: HIGH and CRITICAL fail the job.
      - name: Enforce backend security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fertilizer-backend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Enforce frontend security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fertilizer-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports
          path: |
            backend-trivy-report.txt
            frontend-trivy-report.txt
          if-no-files-found: warn
          retention-days: 30
